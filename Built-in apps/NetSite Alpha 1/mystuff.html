<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNE — My Stuff</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@font-face {
  font-family: 'Black Boys on Mopeds';
  src: local('Black Boys on Mopeds'), local('BlackBoysOnMopeds');
}
body {
  font-family: Verdana, Arial, Helvetica, sans-serif;
  font-size: 12px;
  background: #e6e8eb;
  color: #333;
  min-height: 100vh;
}

/* ─── TOP BAR ─── */
#topbar {
  height: 50px;
  background: linear-gradient(180deg, #4a90d9 35%, #2d6eb5 70%, #1a5294 100%);
  border-bottom: 2px solid #0e3d6b;
  display: flex;
  align-items: center;
  padding: 0 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  position: sticky;
  top: 0;
  z-index: 100;
}
#topbar .logo {
  font-family: 'Black Boys on Mopeds', 'Comic Sans MS', Arial, sans-serif;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  margin-right: 30px;
  text-decoration: none;
}
#topbar .nav-links { display: flex; gap: 4px; align-items: center; }
#topbar .nav-link {
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  padding: 6px 14px;
  border-radius: 4px;
  text-decoration: none;
  text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: background 0.15s;
}
#topbar .nav-link:hover { background: rgba(255,255,255,0.2); }
#topbar .nav-link.active { background: rgba(255,255,255,0.25); }
#topbar .spacer { flex: 1; }

/* ─── CLAY BUTTONS ─── */
.clay-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: Verdana, sans-serif;
  font-weight: bold;
  font-size: 12px;
  color: #333;
  border-radius: 6px;
  padding: 7px 16px;
  background: linear-gradient(180deg, #e8e8e8 0%, #c8c8c8 100%);
  border: 2px solid rgba(0,0,0,0.25);
  box-shadow: 0 3px 0 #aaa, 0 4px 8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.5);
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  transition: transform 0.05s, box-shadow 0.05s;
}
.clay-btn:hover { background: linear-gradient(180deg, #f0f0f0 0%, #d4d4d4 100%); }
.clay-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #aaa; }
.clay-btn.green {
  background: linear-gradient(180deg, #5cb85c 0%, #3d8b3d 100%);
  border-color: #2a6f2a;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  box-shadow: 0 3px 0 #2a6f2a, 0 4px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.25);
}
.clay-btn.green:hover { background: linear-gradient(180deg, #6cc76c 0%, #4a9d4a 100%); }
.clay-btn.primary {
  background: linear-gradient(180deg, #4a90d9 0%, #2d6eb5 100%);
  border-color: #1a5294;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  box-shadow: 0 3px 0 #1a5294, 0 4px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.25);
}
.clay-btn.primary:hover { background: linear-gradient(180deg, #5aa0e9 0%, #3d7ec5 100%); }
.clay-btn.danger {
  background: linear-gradient(180deg, #d9534f 0%, #c9302c 100%);
  border-color: #ac2925;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  box-shadow: 0 3px 0 #ac2925, 0 4px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.25);
}
.clay-btn.danger:hover { background: linear-gradient(180deg, #e9635f 0%, #d9403c 100%); }

/* ─── CONTENT ─── */
.content-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px;
}
.page-title {
  font-size: 20px;
  font-weight: bold;
  color: #333;
  margin-bottom: 6px;
}
.page-subtitle {
  color: #888;
  font-size: 12px;
  margin-bottom: 20px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.toolbar .spacer { flex: 1; }

/* ─── PROJECT LIST ─── */
.project-row {
  display: flex;
  align-items: center;
  background: #fff;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 8px;
  transition: box-shadow 0.1s;
}
.project-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.project-row .p-name {
  font-weight: bold;
  font-size: 13px;
  flex: 1;
  color: #333;
}
.project-row .p-date {
  font-size: 10px;
  color: #999;
  margin-right: 14px;
}
.project-row .p-actions {
  display: flex;
  gap: 6px;
}
.empty-state {
  text-align: center;
  padding: 40px;
  color: #999;
  font-size: 14px;
}

/* ─── FOOTER ─── */
#footer {
  background: #333;
  color: #999;
  text-align: center;
  padding: 20px;
  font-size: 11px;
  margin-top: 60px;
}
#footer a { color: #8ab4f8; text-decoration: none; }
#footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- ═══════════════ TOP BAR ═══════════════ -->
<div id="topbar">
  <a class="logo" href="index.html"><img src="assets/funnynetworkengine.png" alt="FunnyNetworkEngine" style="height: 28px; vertical-align: middle;"></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Create</a>
    <a class="nav-link" href="community.html">Community</a>
    <a class="nav-link active" href="mystuff.html">My Stuff</a>
  </div>
  <div class="spacer"></div>
  <div id="auth-buttons" style="display:flex; gap:4px;">
    <a class="nav-link" href="index.html" style="background:linear-gradient(180deg,#5cb85c 0%,#3d8b3d 100%); border-radius:5px; padding:5px 12px;">Join</a>
    <a class="nav-link" href="index.html" style="padding:5px 12px;">Sign In</a>
  </div>
  <div id="user-area" style="display:none; position:relative;">
    <span style="color:#fff; font-weight:bold; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px 8px;" id="user-badge-ms">
      <img src="assets/user.png" alt="" style="width:22px; height:22px; image-rendering:pixelated; border-radius:3px;">
      <span id="user-nick-ms"></span>
    </span>
  </div>
</div>

<!-- ═══════════════ CONTENT ═══════════════ -->
<div class="content-wrap">
  <h1 class="page-title">My Stuff</h1>
  <p class="page-subtitle" id="user-greeting">Your saved projects</p>

  <div class="toolbar">
    <button class="clay-btn green" onclick="newProjectInEditor()">+ New Project</button>
    <button class="clay-btn" onclick="document.getElementById('upload-fn0').click()">Upload .fn0</button>
    <input type="file" id="upload-fn0" accept=".fn0" style="display:none" onchange="uploadFn0(event)">
    <div class="spacer"></div>
  </div>

  <div id="project-list">
    <div class="empty-state" id="empty-msg">Loading...</div>
  </div>
</div>

<!-- ═══════════════ FOOTER ═══════════════ -->
<div id="footer">
  FunnyNetworkEngine &copy; 2026 &mdash; <a href="index.html">Back to Editor</a>
</div>

<script>
var _currentUser = null;

function init() {
  var saved = localStorage.getItem("fne_current_user");
  if (!saved) {
    document.getElementById("empty-msg").textContent = "Please log in from the editor to see your projects.";
    return;
  }
  try { _currentUser = JSON.parse(saved); } catch(e) { return; }
  document.getElementById("user-greeting").textContent = _currentUser.nickname + "'s projects";
  // Show logged-in state in topbar
  document.getElementById("auth-buttons").style.display = "none";
  document.getElementById("user-area").style.display = "flex";
  document.getElementById("user-nick-ms").textContent = _currentUser.nickname;
  loadProjects();
}

function loadProjects() {
  var users = JSON.parse(localStorage.getItem("fne_users") || "{}");
  var user = users[_currentUser.nickname.toLowerCase()];
  if (!user || !user.projects || user.projects.length === 0) {
    document.getElementById("empty-msg").textContent = "No projects yet! Create one from the editor or upload a .fn0 file.";
    return;
  }
  document.getElementById("empty-msg").style.display = "none";
  var list = document.getElementById("project-list");
  // Clear existing rows (keep empty msg)
  list.querySelectorAll(".project-row").forEach(function(r) { r.remove(); });

  user.projects.forEach(function(p, idx) {
    var row = document.createElement("div");
    row.className = "project-row";
    var dateStr = p.updated ? new Date(p.updated).toLocaleDateString() : "";
    row.innerHTML =
      '<span class="p-name">' + escapeHtml(p.name) + '</span>' +
      '<span class="p-date">' + dateStr + '</span>' +
      '<div class="p-actions">' +
        '<button class="clay-btn primary" onclick="openProject(' + idx + ')">Open</button>' +
        '<button class="clay-btn" onclick="downloadProject(' + idx + ')">Download</button>' +
        '<button class="clay-btn danger" onclick="deleteProject(' + idx + ')">Delete</button>' +
      '</div>';
    list.appendChild(row);
  });
}

function escapeHtml(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function openProject(idx) {
  var users = JSON.parse(localStorage.getItem("fne_users") || "{}");
  var user = users[_currentUser.nickname.toLowerCase()];
  if (!user || !user.projects[idx]) return;
  sessionStorage.setItem("fne_load_project", user.projects[idx].data);
  window.location.href = "index.html?loadFromCommunity=1";
}

function downloadProject(idx) {
  var users = JSON.parse(localStorage.getItem("fne_users") || "{}");
  var user = users[_currentUser.nickname.toLowerCase()];
  if (!user || !user.projects[idx]) return;
  var p = user.projects[idx];
  var blob = new Blob([p.data], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = p.name.replace(/[^a-zA-Z0-9_\- ]/g, "") + ".fn0";
  a.click();
  URL.revokeObjectURL(a.href);
}

function deleteProject(idx) {
  if (!confirm("Delete this project? This cannot be undone.")) return;
  var users = JSON.parse(localStorage.getItem("fne_users") || "{}");
  var user = users[_currentUser.nickname.toLowerCase()];
  if (!user) return;
  user.projects.splice(idx, 1);
  users[_currentUser.nickname.toLowerCase()] = user;
  localStorage.setItem("fne_users", JSON.stringify(users));
  loadProjects();
  if (!user.projects.length) {
    document.getElementById("empty-msg").textContent = "No projects yet!";
    document.getElementById("empty-msg").style.display = "";
  }
}

function newProjectInEditor() {
  window.location.href = "index.html";
}

function uploadFn0(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  if (!file.name.endsWith(".fn0")) {
    alert("Please select a .fn0 file.");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var data = e.target.result;
    // Validate JSON
    try { JSON.parse(data); } catch(ex) {
      alert("Invalid .fn0 file.");
      return;
    }
    var projectName = file.name.replace(".fn0", "") || "Uploaded Project";

    var users = JSON.parse(localStorage.getItem("fne_users") || "{}");
    var user = users[_currentUser.nickname.toLowerCase()];
    if (!user) { alert("Please log in first."); return; }
    if (!user.projects) user.projects = [];
    user.projects.push({
      name: projectName,
      data: data,
      created: new Date().toISOString(),
      updated: new Date().toISOString()
    });
    users[_currentUser.nickname.toLowerCase()] = user;
    localStorage.setItem("fne_users", JSON.stringify(users));
    loadProjects();
  };
  reader.readAsText(file);
  evt.target.value = "";
}

init();
</script>
</body>
</html>
