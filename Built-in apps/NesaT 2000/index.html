<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NESAT 2000 Search</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="./static/style.css">
</head>
<body style="min-height:100vh; background: linear-gradient(150deg, #8ec5ea, #4c7ca3 48%, #294a68);">
  <main class="page-shell home-shell">
    <div id="live-status">NesaT 2000 Search</div>
    <section class="home-window home-search-area">
      <div class="search-area-toolbar"><div class="nav-body inner-nav-body"><div class="nav-brand"><img src="./imageres/logo.png" alt="" class="brand-icon"><div><strong>NESAT 2000</strong><p>internet search engine</p></div></div><nav class="nav-links"><a class="nav-link active" href="./index.html">Home</a></nav></div></div>
      <div class="home-body">
        <div class="hero-logo-row"><img src="./imageres/logo_title.png" alt="NESAT 2000" class="hero-wordmark-icon"></div>
        <p class="hero-tagline">internet search across your own mixed web index</p>
        <form class="google-search-form" onsubmit="return false"><div class="search-row search-controls-row"><img src="./imageres/find.png" alt="" class="search-row-icon"><input type="text" aria-label="Search NesaT" autocomplete="off" placeholder="Search is available in the desktop edition"><div class="search-inline-buttons"><button type="button" class="icon-only-button" aria-label="Find"><img src="./imageres/find.png" alt=""></button></div></div></form>
      </div>
    </section>
    <section class="window tools-window"><div class="title-bar"><div class="title-bar-text">Internet Index</div></div><div class="window-body"><p class="small-note">Search the NesaT catalog from this classic web page.</p></div></section>
  </main>
</body>
</html>
